<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Lente Vivo logo">
  <title>Lente Vivo</title>

  <!-- Fondo -->
  <rect width="200" height="60" rx="6" fill="#0d0d0d"/>

  <!-- Textos -->
  <text x="14" y="22" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#c8a96e" letter-spacing="3">LENTE</text>
  <text x="14" y="42" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#ffffff">Vivo</text>

  <!-- Ícono de diafragma / lente -->
  <!-- Anillo exterior -->
  <circle cx="175" cy="30" r="14" fill="none" stroke="#c8a96e" stroke-width="1.5"/>
  <!-- Anillo intermedio (detalle de diafragma) -->
  <circle cx="175" cy="30" r="10" fill="none" stroke="#c8a96e" stroke-width="0.6" opacity="0.45"/>
  <!-- Lente central -->
  <circle cx="175" cy="30" r="7" fill="#c8a96e" opacity="0.9"/>
  <!-- Reflejo de lente -->
  <circle cx="172" cy="27" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- Líneas de diafragma (paletas) -->
  <g stroke="#c8a96e" stroke-width="0.8" opacity="0.55">
    <line x1="175" y1="16" x2="175" y2="44"/>
    <line x1="163.1" y1="23" x2="186.9" y2="37"/>
    <line x1="163.1" y1="37" x2="186.9" y2="23"/>
  </g>
</svg>
